[project]
name = "xpisode-realsense"
version = "0.1.0"
description = "RealSense depth cameras as xpisode device peers."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.10",
  "pyrealsense2>=2.59",
  "xpisode-device[iox]>=0.1.0,<0.2",
  "xpisode-format>=0.1.0,<0.2",
]

[project.urls]
Repository = "https://github.com/ningma-dev/xpisode-realsense"
Issues = "https://github.com/ningma-dev/xpisode-realsense/issues"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pyright[nodejs]>=1.1.400", "pytest>=8.3", "ruff>=0.12"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "PT", "RUF", "BLE"]

[tool.ruff.lint.isort]
known-first-party = ["xpisode_realsense"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = ["--strict-markers", "-m", "not hardware"]
markers = ["hardware: needs a RealSense camera; run with `pytest -m hardware`"]
filterwarnings = ["error"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "docs", "scripts", ".github", "README.md", "CHANGELOG.md", "CONTRIBUTING.md", "LICENSE", "pyproject.toml", "uv.lock"]

[tool.uv.sources]
xpisode-device = { git = "https://github.com/ningma-dev/xpisode.git", rev = "a96b19a1afbfb0b5722dd3f12740ab3b25bdb775", subdirectory = "packages/xpisode-device" }
xpisode-format = { git = "https://github.com/ningma-dev/xpisode.git", rev = "a96b19a1afbfb0b5722dd3f12740ab3b25bdb775", subdirectory = "packages/xpisode-format" }

[tool.hatch.build.targets.wheel]
packages = ["src/xpisode_realsense"]
